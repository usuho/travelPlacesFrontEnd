<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <style>
      image { image-rendering: auto; }
    </style>
  </defs>
  <!-- Square transparent canvas; no border, no shadow -->
  <rect width="512" height="512" fill="transparent"/>
  <!-- Embed the original PNG, keep aspect ratio, center it, do not stretch -->
  <image href="site-icon.png" x="0" y="0" width="512" height="512" preserveAspectRatio="xMidYMid meet"/>
</svg>
